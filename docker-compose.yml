# InfraWatch server stack: PostgreSQL + FastAPI backend + nginx/dashboard.
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d
# Only the nginx container publishes a port; the database and backend are
# reachable solely on the internal network.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: infrawatch-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-infrawatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-infrawatch}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      AGENT_OFFLINE_AFTER_SECONDS: ${AGENT_OFFLINE_AFTER_SECONDS:-30}
      RAW_RETENTION_HOURS: ${RAW_RETENTION_HOURS:-48}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      DAILY_RETENTION_DAYS: ${DAILY_RETENTION_DAYS:-365}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # Declared here (not only in the Dockerfile) so it also works with Podman,
    # which ignores HEALTHCHECK in OCI-format images.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    image: infrawatch-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
