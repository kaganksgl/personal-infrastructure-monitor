name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: infrawatch
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: infrawatch_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U infrawatch" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://infrawatch:testpass@127.0.0.1:5433/infrawatch_test

  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./agent[dev]"
      # Backend deps let the contract test validate a real sample against the server schema.
      - run: pip install "pydantic>=2.7" "pydantic-settings>=2.7"
        if: matrix.python-version == '3.12'
      - run: ruff check agent && ruff format --check agent
      - run: cd agent && mypy infrawatch_agent
      - run: cd agent && pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
