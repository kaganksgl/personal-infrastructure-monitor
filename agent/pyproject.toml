[project]
name = "infrawatch-agent"
version = "1.0.0"
description = "Lightweight Linux monitoring agent for InfraWatch"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",  # portable process table + statvfs; everything else is read from /proc and /sys
    "httpx>=0.27",  # HTTP client with explicit timeouts, keep-alive and TLS verification
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
infrawatch-agent = "infrawatch_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infrawatch_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
"tests/conftest.py" = ["E501"]  # verbatim /proc fixtures

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
exclude = ["tests/"]
